<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>삼한 · 삼걸전 나라별 전신 원화</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f4ecda;color:#493624;font:16px/1.7 'Malgun Gothic',sans-serif}main{max-width:1500px;margin:auto}h1{font-size:30px;margin:0}p{color:#8a7453}section{margin:36px 0}h2{margin-bottom:12px}figure{margin:0;border:1px solid #cbb88f;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#ddd9d0 0% 25%,#f6f3eb 0% 50%) 0 0/24px 24px}img{display:block;width:100%;height:auto}figcaption{padding:12px 18px;background:#fff8e9;font-size:14px}.note{padding:16px;border-left:3px solid #ab783c;background:#fff9ec}details{margin-top:15px}ol{columns:3;column-gap:35px;padding-left:28px;font-size:14px}li{break-inside:avoid;padding:3px 0}@media(max-width:700px){body{padding:16px}ol{columns:1}}
</style><main><h1>나라별 군주·장군 전신 원화</h1><p>신라 22명 · 백제 19명 · 고구려 20명 · 당 8명 / 전체 69명</p><p class="note">투명 배경은 바둑판 무늬 위에서 확인할 수 있습니다. 무늬·이름·목록은 원화에 합성하지 않은 미리보기 요소입니다. 기존 얼굴 초상과 게임 표시 자산은 유지합니다.</p><div id="sheets"></div></main><script>
fetch('manifest.json').then(r=>r.json()).then(data=>{document.getElementById('sheets').innerHTML=data.jobs.map(j=>`<section><h2>${j.name} · ${j.count}명</h2><figure><img src="${j.file.split('/').at(-1)}" alt="${j.name} 군주와 장군 ${j.count}명 전신 원화"><figcaption>${j.columns}열 × ${j.rows}행 · 투명 PNG · 왼쪽 위부터 행 순서</figcaption></figure><details><summary>인물·병과·위치</summary><ol>${j.entries.map(e=>`<li>${e.name} · ${e.role} (${e.row}행 ${e.column}열)</li>`).join('')}</ol></details></section>`).join('');});
</script></html>
